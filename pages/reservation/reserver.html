<div class="hero-scene text-center text-white">

<div class="hero-scene-content">
    <h1>Ma réservation</h1>
</div>
</div>

<div class="container">
    <form>
<div class="mb-3">
    <label for="NomInput" class="form-label">Nom</label>
    <input disabled type="text" class="form-control" id="NomInput" placeholder="Votre nom" value="Lannoy">
  </div>

  <div class="mb-3">
    <label for="PrenomInput" class="form-label">Prénom</label>
    <input disabled type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom" value="Lucas">
  </div>

        
<div class="mb-3">
    <label for="AllergieInput" class="form-label">Allergie</label>
    <input type="text" class="form-control" id="AllergieInput" placeholder="Entrez votre allergie (fruits de mer, gluten,arrachides...)" value="gluten">
  </div>

  <div class="mb-3">
    <label for="NbConvivesInput" class="form-label">Nombres de convives habituel</label>
    <input type="number" class="form-control" id="NbConvivesInput" placeholder="Combien etes-vous habituellement ?" value="4">
  </div>

  <div class="mb-3">
    <label for="DateInput" class="form-label">Date</label>
    <input type="date" class="form-control" id="DateInput">
  </div>

  <div class="mb-3">

    <div class="form-check">
  <input class="form-check-input" type="radio" name="ServiceChoisi" id="MidiRadio">
  <label class="form-check-label" for="MidiRadio">
    Midi
  </label>
</div>

<div class="form-check">
  <input class="form-check-input" type="radio" name="ServiceChoisi" id="SoirRadio" checked>
  <label class="form-check-label" for="SoirRadio">
    Soir
  </label>
</div>

  </div>


  <div class="mb-3">

    <label for="selectHour" class="form-label">heure</label>

  <select class="form-select" id="selectHour">
  <option>19h30</option>
  <option>19h45</option>
  <option>20h00</option>
  <option>20h15</option>
  <option>20h30</option>
  <option>20h45</option>
  <option>21h00</option>
  

</select>

  </div>


    
  <div class="text-center">
      <button type="submit" class="btn btn-primary">Réserver</button>
      <button type="button" class="btn btn-danger">Annuler</button>
  </div>

 
</form>


  </div>
